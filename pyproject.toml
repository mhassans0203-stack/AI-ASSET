[project]
name = "loan-prediction-knn"
version = "1.0.0"
description = "Loan Application Approval Prediction using K-Nearest Neighbors Classifier"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0"
]

[tool.vercel]
entrypoint = "backend.app:app"
